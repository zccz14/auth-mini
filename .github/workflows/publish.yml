name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm run build

      - name: Verify build outputs
        run: |
          test -f dist/openapi.yaml
          test -f dist/sdk/api.js
          test -f dist/sdk/browser.js
          test -f dist/sdk/device.js

      - name: Check if version already exists
        id: check_version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version already published: $PACKAGE_NAME@$PACKAGE_VERSION"
          else
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version not yet published: $PACKAGE_NAME@$PACKAGE_VERSION"
          fi

      - name: Publish to npm
        if: steps.check_version.outputs.skip_publish == 'false'
        run: npm publish --provenance --access public

  publish-react-components:
    needs: publish-npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/auth-mini-react-components/pnpm-lock.yaml

      - name: Install and build Browser SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install component dependencies
        run: pnpm --dir packages/auth-mini-react-components install --frozen-lockfile --ignore-scripts

      - name: Check component package
        run: |
          pnpm --dir packages/auth-mini-react-components run typecheck
          pnpm --dir packages/auth-mini-react-components test
          pnpm --dir packages/auth-mini-react-components run build
          pnpm --dir packages/auth-mini-react-components run pack:check

      - name: Verify build outputs
        run: |
          test -f packages/auth-mini-react-components/dist/index.js
          test -f packages/auth-mini-react-components/dist/index.d.ts

      - name: Check if version already exists
        id: check_version
        working-directory: packages/auth-mini-react-components
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version already published: $PACKAGE_NAME@$PACKAGE_VERSION"
          else
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version not yet published: $PACKAGE_NAME@$PACKAGE_VERSION"
          fi

      - name: Publish to npm
        if: steps.check_version.outputs.skip_publish == 'false'
        working-directory: packages/auth-mini-react-components
        run: npm publish --provenance --access public
