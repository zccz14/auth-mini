name: GUI CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui-web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install ui-web dependencies
        run: npm --prefix ui-web ci

      - name: Build GUI
        run: npm run gui:build

      - name: Typecheck GUI
        run: npm run gui:typecheck

      - name: Test GUI
        run: npm --prefix ui-web test
