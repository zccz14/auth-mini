name: PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm run build

  react-components:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/auth-mini-react-components/pnpm-lock.yaml

      - name: Install and build Browser SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install component dependencies
        run: pnpm --dir packages/auth-mini-react-components install --frozen-lockfile --ignore-scripts

      - name: Check component package
        run: |
          pnpm --dir packages/auth-mini-react-components run typecheck
          pnpm --dir packages/auth-mini-react-components test
          pnpm --dir packages/auth-mini-react-components run build
          pnpm --dir packages/auth-mini-react-components run pack:check
