[package]
name = "auth-mini"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
ed25519-dalek = "2.1.1"
flate2 = "1.0.35"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "hostname", "smtp-transport", "native-tls"] }
openssl-sys = { version = "0.9.116", features = ["vendored"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
serde_yaml = "0.9.34"
sha2 = "0.10.8"
sysinfo = { version = "0.38.4", default-features = false, features = ["disk", "network", "system"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
url = "2.5.4"
webauthn-rs = { version = "0.5.5", default-features = false, features = ["conditional-ui", "danger-allow-state-serialisation"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
